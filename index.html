<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTrade | Advanced Trading Dashboard</title>
    <!-- Tailwind CSS for layout and modern components -->
    <script src="https://tailwindcss.com"></script>
    <!-- Lucide Icons for clean visual anchors -->
    <script src="https://unpkg.com"></script>
    <!-- Lightweight Charts by TradingView for clean canvas data rendering -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #0b0e11;
            color: #eaecef;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .crypto-green { color: #0ecb81; }
        .crypto-red { color: #f6465d; }
        .bg-crypto-dark { background-color: #181a20; }
        .bg-crypto-panel { background-color: #1e222d; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-crypto-dark border-b border-gray-800 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-8">
            <div class="flex items-center space-x-2 text-yellow-500 font-bold text-xl tracking-wider">
                <i data-lucide="trending-up" class="w-6 h-6"></i>
                <span>APEXTRADE</span>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium text-gray-400">
                <a href="#" class="text-white hover:text-yellow-500 transition">Dashboard</a>
                <a href="#" class="hover:text-yellow-500 transition">Markets</a>
                <a href="#" class="hover:text-yellow-500 transition">Wallet</a>
                <a href="#" class="hover:text-yellow-500 transition">Analytics</a>
            </nav>
        </div>
        
        <div class="flex items-center space-x-4">
            <div class="text-right hidden sm:block">
                <p class="text-xs text-gray-500">Available Balance</p>
                <p class="text-sm font-bold text-yellow-500" id="wallet-balance">$45,250.80</p>
            </div>
            <div class="h-8 w-8 rounded-full bg-yellow-500 text-black flex items-center justify-center font-bold text-sm cursor-pointer">
                U
            </div>
        </div>
    </header>

    <!-- Main Workspace Layout Grid -->
    <main class="flex-1 grid grid-cols-1 xl:grid-cols-4 gap-4 p-4">
        
        <!-- Left Column: Watchlist & Market Metrics -->
        <section class="xl:col-span-1 bg-crypto-dark p-4 rounded-xl border border-gray-800 flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h2 class="font-semibold text-gray-200 flex items-center gap-2">
                    <i data-lucide="star" class="w-4 h-4 text-yellow-500 fill-current"></i> Watchlist
                </h2>
                <span class="text-xs bg-gray-800 text-gray-400 px-2 py-1 rounded">USD Pairs</span>
            </div>
            
            <!-- Asset Interactive Rows Container -->
            <div class="flex-1 overflow-y-auto space-y-2" id="watchlist-container">
                <!-- Injected via JavaScript dynamically -->
            </div>
        </section>

        <!-- Center Column: Advanced Live Chart Platform -->
        <section class="xl:col-span-2 flex flex-col space-y-4">
            <!-- Active Ticker Bar Info -->
            <div class="bg-crypto-dark p-4 rounded-xl border border-gray-800 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-yellow-500/10 rounded-lg">
                        <i data-lucide="activity" class="w-6 h-6 text-yellow-500" id="active-icon"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold" id="active-symbol">BTC/USD</h1>
                        <p class="text-xs text-gray-400" id="active-name">Bitcoin Core Asset</p>
                    </div>
                </div>
                <div class="flex space-x-6 text-sm">
                    <div>
                        <p class="text-xs text-gray-500">Live Price</p>
                        <p class="font-mono font-bold text-lg" id="active-price">$64,250.00</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500">24h Change</p>
                        <p class="font-mono font-bold text-sm crypto-green" id="active-change">+3.45%</p>
                    </div>
                    <div class="hidden sm:block">
                        <p class="text-xs text-gray-500">24h High</p>
                        <p class="font-mono text-sm" id="active-high">$64,800.00</p>
                    </div>
                </div>
            </div>

            <!-- Candlestick Graphic Container Canvas -->
            <div class="flex-1 bg-crypto-dark p-4 rounded-xl border border-gray-800 flex flex-col min-h-[350px]">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs text-gray-400 font-semibold tracking-wider uppercase">Interactive Price Action</span>
                    <div class="flex space-x-2 text-xs bg-crypto-panel p-1 rounded-md">
                        <button class="px-2 py-1 bg-gray-700 rounded text-white font-medium">1H</button>
                        <button class="px-2 py-1 text-gray-400 hover:text-white">4H</button>
                        <button class="px-2 py-1 text-gray-400 hover:text-white">1D</button>
                    </div>
                </div>
                <div id="chart-area" class="w-full flex-1 relative rounded overflow-hidden">
                    <!-- Embedded Canvas via JS Engine -->
                </div>
            </div>
        </section>

        <!-- Right Column: Trade Terminal Executions -->
        <section class="xl:col-span-1 bg-crypto-dark p-4 rounded-xl border border-gray-800 flex flex-col justify-between space-y-4">
            <div>
                <div class="flex border-b border-gray-800 mb-4">
                    <button id="tab-buy" class="flex-1 text-center pb-2 border-b-2 border-green-500 font-semibold crypto-green text-sm" onclick="switchOrderType('buy')">BUY</button>
                    <button id="tab-sell" class="flex-1 text-center pb-2 border-b-2 border-transparent font-semibold text-gray-500 hover:text-gray-300 text-sm" onclick="switchOrderType('sell')">SELL</button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Order Type</label>
                        <select class="w-full bg-crypto-panel border border-gray-700 rounded p-2 text-sm text-gray-200 outline-none focus:border-yellow-500">
                            <option>Market Order</option>
                            <option>Limit Order</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Execution Asset Price (USD)</label>
                        <input type="text" id="trade-price-input" readonly class="w-full bg-crypto-panel border border-gray-700 rounded p-2 text-sm font-mono text-gray-400 outline-none" value="64250.00">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Amount / Size</label>
                        <div class="relative">
                            <input type="number" id="trade-amount" class="w-full bg-crypto-panel border border-gray-700 rounded p-2 text-sm font-mono text-white outline-none focus:border-yellow-500" value="0.1" step="0.01" oninput="calculateTotal()">
                            <span class="absolute right-3 top-2 text-xs text-gray-500 font-bold" id="unit-ticker">BTC</span>
                        </div>
                    </div>

                    <div class="bg-crypto-panel p-3 rounded-lg border border-gray-800 space-y-2">
                        <div class="flex justify-between text-xs text-gray-400">
                            <span>Estimated Fees (0.1%)</span>
                            <span id="est-fee">$6.42</span>
                        </div>
                        <div class="flex justify-between text-sm font-bold border-t border-gray-700 pt-2">
                            <span>Total Outlay</span>
                            <span id="total-outlay" class="crypto-green">$6,431.42</span>
                        </div>
                    </div>
                </div>
            </div>

            <button id="submit-order-btn" class="w-full py-3 bg-emerald-500 text-black font-bold rounded-xl transition hover:bg-emerald-400 tracking-wider shadow-lg text-sm" onclick="executeMockTrade()">
                PLACE ORDER
            </button>
        </section>

    </main>

    <!-- UI Interaction Architecture Core Script -->
    <script>
        // Mock dataset modeling an live API state loop

            'BTC': { symbol: 'BTC/USD', name: 'Bitcoin Core Asset', price: 64250.00, change: 3.45, high: 64800.00, icon: 'bitcoin', unit: 'BTC' },
            'ETH': { symbol: 'ETH/USD', name: 'Ethereum Network', price: 3450.25, change: -1.20, high: 3560.00, icon: 'layers', unit: 'ETH' },

            'NVDA': { symbol: 'NVDA', name: 'NVIDIA Corp Systems', price: 875.12, change: 5.82, high: 880.00, icon: 'cpu', unit: 'Shares' }
        };

        let currentActiveTicker = 'BTC';
